<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="175" fill="#ffffff" opacity="0.1" />

  <!-- Body / Hoodie -->
  <path d="M100,380 C100,300 140,270 200,270 C260,270 300,300 300,380 Z" fill="#1e293b" filter="url(#shadow)" />
  <!-- Shirt collar -->
  <path d="M165,275 Q200,320 235,275 Z" fill="#3b82f6" />
  
  <!-- Neck -->
  <rect x="180" y="220" width="40" height="60" rx="10" fill="url(#skinGrad)" />
  
  <!-- Head & Ears -->
  <circle cx="140" cy="190" r="16" fill="url(#skinGrad)" />
  <circle cx="260" cy="190" r="16" fill="url(#skinGrad)" />
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="url(#skinGrad)" filter="url(#shadow)" />

  <!-- Hair -->
  <path d="M140,165 C135,115 170,105 200,105 C240,105 265,115 260,165 C250,135 230,125 200,125 C170,125 150,140 140,165 Z" fill="url(#hairGrad)" />

  <!-- Eyeglasses -->
  <rect x="155" y="165" width="36" height="26" rx="6" fill="#0f172a" opacity="0.9" />
  <rect x="159" y="169" width="28" height="18" rx="4" fill="#67e8f9" opacity="0.4" />
  <rect x="209" y="165" width="36" height="26" rx="6" fill="#0f172a" opacity="0.9" />
  <rect x="213" y="169" width="28" height="18" rx="4" fill="#67e8f9" opacity="0.4" />
  <rect x="191" y="174" width="18" height="4" rx="2" fill="#0f172a" />
  <line x1="145" y1="175" x2="155" y2="175" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="245" y1="175" x2="255" y2="175" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M185,215 Q200,228 215,215" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Code elements in background -->
  <text x="50" y="100" fill="#ffffff" opacity="0.4" font-family="monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>
  <text x="310" y="120" fill="#ffffff" opacity="0.4" font-family="monospace" font-size="26" font-weight="bold">{ ; }</text>
  <text x="60" y="270" fill="#ffffff" opacity="0.3" font-family="monospace" font-size="22" font-weight="bold">const</text>
  <text x="300" y="290" fill="#ffffff" opacity="0.3" font-family="monospace" font-size="22" font-weight="bold">===</text>
</svg>
