<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#p3Grad)" />

  <!-- Center Presentation: Mobile App Mockups -->
  <!-- Left Phone Mockup -->
  <g transform="translate(130, 40)">
    <rect width="150" height="300" rx="20" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <!-- Screen -->
    <rect x="8" y="10" width="134" height="280" rx="14" fill="#1e1b4b" />
    <!-- Notch -->
    <rect x="45" y="14" width="60" height="10" rx="5" fill="#0f172a" />
    <!-- Header -->
    <text x="20" y="48" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="bold">CampusHub</text>
    <!-- Card -->
    <rect x="18" y="62" width="114" height="60" rx="8" fill="url(#phoneGrad)" />
    <text x="26" y="85" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">Presensi QR Code</text>
    <text x="26" y="102" fill="#fdf2f8" font-family="sans-serif" font-size="8">Status: Hadir Tepat Waktu</text>
    <!-- List -->
    <rect x="18" y="132" width="114" height="36" rx="6" fill="#312e81" />
    <rect x="18" y="176" width="114" height="36" rx="6" fill="#312e81" />
    <rect x="18" y="220" width="114" height="36" rx="6" fill="#312e81" />
  </g>

  <!-- Right Phone Mockup -->
  <g transform="translate(320, 30)">
    <rect width="150" height="300" rx="20" fill="#0f172a" stroke="#8b5cf6" stroke-width="4" />
    <!-- Screen -->
    <rect x="8" y="10" width="134" height="280" rx="14" fill="#18181b" />
    <!-- Notch -->
    <rect x="45" y="14" width="60" height="10" rx="5" fill="#0f172a" />
    <!-- Profile header -->
    <circle cx="75" cy="55" r="22" fill="#ec4899" />
    <text x="50" y="92" fill="#fafafa" font-family="sans-serif" font-size="10" font-weight="bold">Andrian</text>
    <text x="42" y="105" fill="#a1a1aa" font-family="sans-serif" font-size="8">Informatika - Smtr 4</text>
    <!-- Schedule Card -->
    <rect x="18" y="120" width="114" height="75" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="28" y="140" fill="#a855f7" font-family="sans-serif" font-size="9" font-weight="bold">Jadwal UTS Hari Ini</text>
    <text x="28" y="158" fill="#e4e4e7" font-family="sans-serif" font-size="8">Pemrograman Web</text>
    <text x="28" y="175" fill="#10b981" font-family="sans-serif" font-size="8">Ruang Lab Komputer 3</text>
    <!-- Bottom Nav -->
    <rect x="18" y="250" width="114" height="30" rx="6" fill="#27272a" />
    <circle cx="36" cy="265" r="5" fill="#a855f7" />
    <circle cx="75" cy="265" r="5" fill="#71717a" />
    <circle cx="114" cy="265" r="5" fill="#71717a" />
  </g>
</svg>
